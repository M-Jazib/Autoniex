name: 🚀 Build & Deploy Autoniex to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  build-and-deploy:
    name: Build Next.js & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js 20
      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: 📦 Install dependencies
        run: npm ci

      # 4. Build Next.js static export (generates out/ folder)
      - name: 🏗️ Build static export
        run: npm run build

      # 5. Deploy out/ folder to Hostinger via FTP
      - name: 📡 Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .DS_Store

      # 6. Success notification in GitHub Actions log
      - name: ✅ Deployment Complete
        run: echo "Autoniex successfully deployed to Hostinger! Live at your domain."
